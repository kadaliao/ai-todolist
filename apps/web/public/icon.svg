<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Docket">
  <title>Docket</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24a079"/>
      <stop offset="1" stop-color="#1a7f5e"/>
    </linearGradient>
    <linearGradient id="slip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef6f2"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <!-- the docket slip -->
  <rect x="262" y="226" width="500" height="572" rx="72" fill="url(#slip)"/>
  <rect x="262" y="226" width="500" height="572" rx="72" fill="none" stroke="#0d4f39" stroke-opacity=".08" stroke-width="6"/>
  <!-- two done lines and the check -->
  <rect x="342" y="330" width="260" height="34" rx="17" fill="#1f8f6a" opacity=".22"/>
  <rect x="342" y="404" width="200" height="34" rx="17" fill="#1f8f6a" opacity=".22"/>
  <path d="M352 594 L452 690 L676 470" fill="none" stroke="#1f8f6a" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
